spring.config.import=optional:file:.env[.properties]

spring.application.name=wakebook
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Seoul

data4library.base-url=http://data4library.kr/api
data4library.auth-key=${DATA4LIBRARY_API_KEY:}
data4library.default-period-months=12

aladin.base-url=https://www.aladin.co.kr/ttb/api
aladin.ttb-key=${ALADIN_TTB_KEY:}

openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

hidden-book.max-loan-count=${HIDDEN_BOOK_MAX_LOAN_COUNT:2}
hidden-book.candidate-pool-size=${HIDDEN_BOOK_POOL_SIZE:30}
# 정보나루 API로 후보군을 만들 때 조회할 장서·대출 순위 기간(개월)
hidden-book.api-period-months=${HIDDEN_BOOK_API_PERIOD_MONTHS:12}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wakebook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# 프론트엔드가 API를 직접 호출할 때 허용할 출처. 배포 시 CORS_ALLOWED_ORIGINS에 실제 도메인을 넣는다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
