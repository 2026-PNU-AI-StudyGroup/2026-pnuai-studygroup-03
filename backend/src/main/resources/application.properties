spring.config.import=optional:file:.env[.properties]

spring.application.name=wakebook
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Seoul

data4library.base-url=https://data4library.kr/api
data4library.auth-key=${DATA4LIBRARY_API_KEY:}
data4library.default-period-months=12

aladin.base-url=https://www.aladin.co.kr/ttb/api
aladin.ttb-key=${ALADIN_TTB_KEY:}

kakao.base-url=https://dapi.kakao.com
kakao.api-key=${KAKAO_API_KEY:}

openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
# 트렌드 적격성 판정/책 매칭은 gpt-4o-mini로는 카테고리 분류가 실행마다 오락가락해서(연예인·스포츠
# 뉴스가 ELIGIBLE로 잘못 통과했다 안 했다 함) 이 판정에만 더 큰 모델을 쓴다(TrendAiConfig 참고).
openai.trend-model=${OPENAI_TREND_MODEL:gpt-4o}

trend.google.base-url=https://trends.google.com
trend.google.region=KR
naver-api.base-url=https://openapi.naver.com
naver-api.client-id=${NAVER_CLIENT_ID:}
naver-api.client-secret=${NAVER_CLIENT_SECRET:}
trend.candidate-limit=${TREND_CANDIDATE_LIMIT:20}
trend.top-trend-count=${TREND_TOP_COUNT:5}
trend.books-per-trend=${TREND_BOOKS_PER_TREND:2}
trend.minimum-topic-confidence=${TREND_MIN_TOPIC_CONFIDENCE:0.70}
trend.minimum-evidence-consistency=${TREND_MIN_EVIDENCE_CONSISTENCY:0.70}
trend.minimum-book-match-score=${TREND_MIN_BOOK_MATCH_SCORE:0.60}
trend.library-trend-candidate-count=${TREND_LIBRARY_CANDIDATE_COUNT:10}
trend.fallback-days=${TREND_FALLBACK_DAYS:3}
trend.force-refresh-cooldown-minutes=${TREND_REFRESH_COOLDOWN_MINUTES:30}
trend.scheduler-enabled=${TREND_SCHEDULER_ENABLED:true}
trend.schedule-cron=${TREND_SCHEDULE_CRON:0 0 5 * * *}

hidden-book.max-loan-count=${HIDDEN_BOOK_MAX_LOAN_COUNT:2}
# KDC 대분류 10종을 우선 20권씩 채우고, 부족한 분야의 몫은 다른 분야의 저이용 도서로 보충한다.
hidden-book.candidate-pool-size=${HIDDEN_BOOK_POOL_SIZE:200}
# 정보나루 API로 후보군을 만들 때 조회할 장서·대출 순위 기간(개월)
hidden-book.api-period-months=${HIDDEN_BOOK_API_PERIOD_MONTHS:12}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wakebook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# 프론트엔드가 API를 직접 호출할 때 허용할 출처. 배포 시 CORS_ALLOWED_ORIGINS에 실제 도메인을 넣는다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
