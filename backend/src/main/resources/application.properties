spring.application.name=wakebook
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Seoul

data4library.base-url=http://data4library.kr/api
data4library.auth-key=${DATA4LIBRARY_API_KEY:}
data4library.default-period-months=12

aladin.base-url=http://www.aladin.co.kr/ttb/api
aladin.ttb-key=${ALADIN_TTB_KEY:}

openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

hidden-book.max-loan-count=${HIDDEN_BOOK_MAX_LOAN_COUNT:2}
hidden-book.candidate-pool-size=${HIDDEN_BOOK_POOL_SIZE:30}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wakebook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
