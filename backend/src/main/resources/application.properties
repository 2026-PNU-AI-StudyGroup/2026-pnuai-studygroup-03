spring.application.name=wakebook
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Seoul

data4library.base-url=http://data4library.kr/api
data4library.auth-key=${DATA4LIBRARY_API_KEY:}
data4library.default-period-months=12
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wakebook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
