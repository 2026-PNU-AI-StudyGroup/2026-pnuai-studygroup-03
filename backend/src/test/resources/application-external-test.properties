spring.datasource.url=${EXTERNAL_TEST_DB_URL}
spring.datasource.username=${EXTERNAL_TEST_DB_USERNAME:root}
spring.datasource.password=${EXTERNAL_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=external-test-only-jwt-secret-key-at-least-32-bytes-long
app.jwt.expiration=3600000

hidden-book.candidate-pool-size=2
hidden-book.api-period-months=12
